<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gonona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f1;
      --card: #ffffff;
      --border: #2c2c2c;
      --border-soft: #d4d2c8;
      --text: #1a1a1a;
      --muted: #8a8a7a;
      --sage: #6b7c5a;
      --sage-track: #e4e2d8;
      --exact: #c4a035;
    }

    body {
      width: 320px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .panel {
      background: var(--card);
      margin: 10px;
      padding: 16px 14px 14px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sage);
      flex: none;
    }
    .dot.exact { background: var(--exact); }
    .title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
    }
    .site-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      text-transform: capitalize;
      line-height: 1.2;
    }
    .mode-label {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .mode-label.exact { color: var(--exact); }

    /* Gauge */
    .gauge-wrapper {
      position: relative;
      height: 118px;
      margin-bottom: 14px;
    }
    .gauge-svg {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 115px;
    }
    .gauge-center {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 140px;
    }
    .percent-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
    }
    .percent-number {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .percent-symbol {
      font-size: 18px;
      font-weight: 700;
      margin-left: 1px;
    }
    .gauge-sub {
      margin-top: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* IN / OUT */
    .inout-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 4px;
    }
    .stat-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-header {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .stat-of {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Metrics */
    .metrics-box {
      margin: 4px 0 12px;
    }
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 2px;
      border-bottom: 1px solid var(--border-soft);
    }
    .metric-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .metric-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
    }
    .metric-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* Actions — 3 equal */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .action-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 4px;
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: background 0.12s ease;
    }
    .action-btn:hover { background: var(--bg); }
    .action-btn svg {
      width: 15px;
      height: 15px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
    }

    /* Move context */
    .section-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .move-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .model-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.12s ease;
    }
    .model-btn:hover { background: var(--bg); }
    .model-btn svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .toast {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .empty {
      padding: 28px 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--muted);
      border: 1.5px dashed var(--border-soft);
      border-radius: 12px;
    }

    .site-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-soft);
      font-size: 11px;
      font-weight: 600;
      color: var(--sage);
      text-decoration: none;
    }
    .site-link:hover { color: var(--text); }
    .site-link svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div id="empty-state" class="empty" hidden>
      Open ChatGPT, Claude, Gemini, GLM, Kimi, or Grok to see live token stats.
    </div>

    <div id="content-state">
      <div class="header">
        <span id="dot" class="dot"></span>
        <span class="title">Gonona</span>
        <span id="site" class="site-pill">ChatGPT</span>
        <span id="mode" class="mode-label">ESTIMATED</span>
      </div>

      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 200 110">
          <path d="M 20,90 A 70,70 0 0,1 180,90" fill="none" stroke="#e4e2d8" stroke-width="12" stroke-linecap="round"/>
          <path id="gauge-arc" d="M 20,90 A 70,70 0 0,1 180,90" fill="none" stroke="#6b7c5a" stroke-width="12" stroke-linecap="round" stroke-dasharray="219.911" stroke-dashoffset="127.5"/>
        </svg>
        <div class="gauge-center">
          <div class="percent-box">
            <span id="percent-big" class="percent-number">42</span>
            <span class="percent-symbol">%</span>
          </div>
          <div class="gauge-sub">Token usage</div>
        </div>
      </div>

      <div class="inout-row">
        <div class="stat-card">
          <div class="stat-header">In tokens</div>
          <div id="in-tokens" class="stat-value">3,425</div>
          <div class="stat-of">of <span id="limit-in">8,192</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Out tokens</div>
          <div id="out-tokens" class="stat-value">1,248</div>
          <div class="stat-of">of <span id="limit-out">8,192</span></div>
        </div>
      </div>

      <div class="metrics-box">
        <div class="metric-row">
          <div class="metric-label">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Messages
          </div>
          <div id="msgs-left" class="metric-val">18</div>
        </div>
        <div class="metric-row">
          <div class="metric-label">
            <svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            Runway
          </div>
          <div id="runway" class="metric-val">3,519 tokens</div>
        </div>
      </div>

      <div class="action-row">
        <button id="copy-btn" class="action-btn" title="Copy user prompts only">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy prompts
        </button>
        <button id="copy-context-btn" class="action-btn" title="Copy full conversation context">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          Copy context
        </button>
        <button id="reset-btn" class="action-btn" title="Reset counters">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Reset
        </button>
      </div>

      <div class="section-title">Move context to</div>
      <div class="move-grid">
        <button id="move-claude" class="model-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 19h4l1.5-3.5h5L16 19h4L12 3zm-1.2 9.5L12 8l1.2 4.5h-2.4z"/></svg>
          Claude
        </button>
        <button id="move-gemini" class="model-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5L12 2z"/></svg>
          Gemini
        </button>
        <button id="move-grok" class="model-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M7 7l10 10"/></svg>
          Grok
        </button>
        <button id="move-chatgpt" class="model-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.907 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.908 6.056 6.056 0 0 0-.747-7.065zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023-.141-.085-4.784-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zM8.306 12.863l-2.02-1.163a.08.08 0 0 1-.038-.057V6.074a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365L12 8.704l2.597 1.498v2.999L12 14.696l-2.597-1.499z"/></svg>
          ChatGPT
        </button>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <a class="site-link" href="https://gonona.vercel.app/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      gonona.vercel.app
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
