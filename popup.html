<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gonona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFF2DF;
      --panel: #ffffff;
      --line: rgba(96,116,86,0.22);
      --text-hi: #2d3a28;
      --text-mid: #607456;
      --text-low: #8fa888;
      --sage: #607456;
      --sage-light: #a8c49a;
      --cream: #FFF2DF;
      --amber: #e8a849;
      --coral: #e07856;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 3px 3px 0 var(--sage); }
      50% { box-shadow: 3px 3px 0 var(--amber); }
    }

    body {
      width: 300px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-hi);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 90% 60% at 10% -20%, rgba(168,196,154,0.5), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 0%, rgba(232,168,73,0.2), transparent 50%),
        linear-gradient(165deg, #FFF2DF 0%, #f5e9d0 50%, #e8f0e2 100%);
    }

    .shell {
      position: relative;
      padding: 16px 14px 14px;
      overflow: hidden;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.3;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%60607456' fill-opacity='0.07'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .panel {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.72);
      border: 2.5px solid var(--sage);
      border-radius: 20px;
      padding: 16px 14px 14px;
      box-shadow: 6px 6px 0 var(--sage);
      backdrop-filter: blur(8px);
      animation: rise 0.45s ease both;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sage);
      border: 2.5px solid var(--text-hi);
      flex: none;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    .dot.exact {
      background: var(--amber);
      animation: none;
      box-shadow: 3px 3px 0 var(--coral);
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1;
    }
    .site-pill {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-hi);
      background: rgba(255,255,255,0.7);
      border: 2px solid var(--sage);
      padding: 2px 9px;
      border-radius: 999px;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .mode-label {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--text-low);
      text-transform: uppercase;
      flex: none;
    }
    .mode-label.exact { color: var(--amber); }

    .block-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-low);
      margin-bottom: 6px;
    }

    .window-text {
      text-align: center;
      font-size: 11px;
      color: var(--text-mid);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .window-text b {
      color: var(--text-hi);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
    }

    /* Gauge */
    .gauge-wrapper {
      position: relative;
      width: 100%;
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
    .gauge-svg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 110px;
      overflow: visible;
    }
    .gauge-tick-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      fill: var(--text-low);
      font-weight: 600;
    }
    .gauge-center {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .percent-box {
      display: flex;
      align-items: baseline;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
    }
    .percent-number {
      font-size: 34px;
      font-weight: 700;
      color: var(--text-hi);
      letter-spacing: -1.5px;
    }
    .percent-symbol {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-mid);
      margin-left: 2px;
    }
    .gauge-sub {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-low);
      margin-top: 4px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Stats — soft glass strips, not heavy cards */
    .inout-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-card {
      background: rgba(255,242,223,0.55);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-mid);
      text-transform: uppercase;
    }
    .dot-in, .dot-out {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--text-hi);
    }
    .dot-in { background: var(--amber); }
    .dot-out { background: var(--coral); }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-hi);
    }

    .metrics-box {
      border-top: 2px dashed var(--line);
      border-bottom: 2px dashed var(--line);
      padding: 2px 2px;
      margin-bottom: 12px;
    }
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 2px;
      font-size: 12px;
      color: var(--text-mid);
    }
    .metric-row:not(:last-child) {
      border-bottom: 1px solid var(--line);
    }
    .metric-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .metric-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--sage);
      fill: none;
    }
    .metric-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12.5px;
      color: var(--text-hi);
    }
    .metric-val.pace { color: var(--coral); }

    /* Pill actions — match website .btn */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 7px;
      margin-bottom: 14px;
    }
    .action-btn {
      background: transparent;
      border: 2px solid var(--text-hi);
      border-radius: 999px;
      padding: 9px 6px;
      color: var(--text-hi);
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 3px 3px 0 var(--sage);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .action-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--sage);
      fill: none;
    }
    .action-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--sage);
    }
    .action-btn:hover svg { stroke: var(--amber); }
    .btn-reset { padding: 0; }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: var(--text-low);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .move-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .model-btn {
      background: rgba(255,255,255,0.65);
      border: 2px solid var(--sage);
      border-radius: 999px;
      padding: 7px 11px;
      color: var(--text-hi);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .model-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--sage);
    }
    .model-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      border: 1.5px solid var(--text-hi);
    }
    .dot-claude { background: #f97316; }
    .dot-gemini { background: #3b82f6; }
    .dot-grok { background: #ffffff; }
    .dot-chatgpt { background: #22c55e; }

    /* Primary CTA — website .btn-primary */
    .optimize-btn {
      width: 100%;
      height: 44px;
      background: var(--sage);
      border: 2.5px solid var(--text-hi);
      border-radius: 999px;
      color: var(--cream);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 4px 4px 0 var(--text-hi);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .optimize-btn svg {
      width: 14px;
      height: 14px;
      fill: var(--cream);
    }
    .optimize-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--text-hi);
    }
    .optimize-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--text-hi);
    }

    .toast {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,242,223,0.9);
      border: 2px solid var(--sage);
      color: var(--text-mid);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      display: none;
      box-shadow: 3px 3px 0 var(--sage);
    }

    .empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--text-mid);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.55;
      border: 2px dashed var(--sage);
      border-radius: 16px;
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div id="empty-state" class="empty" hidden>
        Open a supported AI chat — ChatGPT, Claude, Gemini, GLM, Kimi, or Grok — to see live token stats.
      </div>

      <div id="content-state">
        <div class="header">
          <div class="brand">
            <span id="dot" class="dot"></span>
            <span class="title">Gonona</span>
            <span id="site" class="site-pill">ChatGPT</span>
          </div>
          <span id="mode" class="mode-label">ESTIMATED</span>
        </div>

        <p class="block-label">Token window</p>
        <div class="window-text">
          of a <b id="limit">128,000</b> token window
        </div>

        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 200 110">
            <path d="M 20,90 A 70,70 0 0,1 180,90" fill="none" stroke="#e0d8c8" stroke-width="10" stroke-linecap="round"/>
            <path id="gauge-arc" d="M 20,90 A 70,70 0 0,1 180,90" fill="none" stroke="#607456" stroke-width="10" stroke-linecap="round" stroke-dasharray="219.911" stroke-dashoffset="217.7"/>
            <text x="20" y="108" class="gauge-tick-label" text-anchor="middle">0</text>
            <text x="100" y="12" class="gauge-tick-label" text-anchor="middle">50</text>
            <text x="180" y="108" class="gauge-tick-label" text-anchor="middle">100</text>
          </svg>
          <div class="gauge-center">
            <div class="percent-box">
              <span id="percent-big" class="percent-number">1</span>
              <span class="percent-symbol">%</span>
            </div>
            <div class="gauge-sub">token window used</div>
          </div>
        </div>

        <div class="inout-row">
          <div class="stat-card">
            <div class="stat-header"><span class="dot-in"></span> IN</div>
            <div id="in-tokens" class="stat-value">107</div>
          </div>
          <div class="stat-card">
            <div class="stat-header"><span class="dot-out"></span> OUT</div>
            <div id="out-tokens" class="stat-value">1,296</div>
          </div>
        </div>

        <div class="metrics-box">
          <div class="metric-row">
            <div class="metric-label">
              <svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Messages left
            </div>
            <div id="msgs-left" class="metric-val">~360</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">
              <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Runway pace
            </div>
            <div id="runway" class="metric-val pace">45m</div>
          </div>
        </div>

        <div class="action-row">
          <button id="copy-btn" class="action-btn" title="Copy user prompts only">
            <svg viewBox="0 0 24 24" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy prompts
          </button>
          <button id="copy-context-btn" class="action-btn" title="Copy full conversation context">
            <svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Copy context
          </button>
          <button id="reset-btn" class="action-btn btn-reset" title="Reset counters">
            <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>

        <div class="section-title">Move context to</div>
        <div class="move-grid">
          <button id="move-claude" class="model-btn"><span class="model-dot dot-claude"></span> Claude</button>
          <button id="move-gemini" class="model-btn"><span class="model-dot dot-gemini"></span> Gemini</button>
          <button id="move-grok" class="model-btn"><span class="model-dot dot-grok"></span> Grok</button>
          <button id="move-chatgpt" class="model-btn"><span class="model-dot dot-chatgpt"></span> ChatGPT</button>
        </div>

        <button id="optimize-btn" class="optimize-btn">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Optimize prompt
        </button>

        <div id="toast" class="toast"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
